[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-openbis-uploader"
version = "0.1.0"
description = "CLI tool to upload MOUSE SAXS measurement batches to OpenBIS using a YMD filter."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "BAM MOUSE team"}
]
dependencies = [
  "attrs>=23.2.0",
  "pybis>=1.36.0",
  "logbook2mouse @ git+https://github.com/BAMresearch/logbook2mouse.git",
  "jupyter-analysis-tools",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0.0",
  "pytest>=7.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Repository = "https://example.invalid/replace-me"

[project.scripts]
openbis-mouse-uploader = "mouse_openbis_uploader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
