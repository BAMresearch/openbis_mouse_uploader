[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-openbis-uploader"
version = "0.1.0"
description = "CLI tool to upload MOUSE SAXS measurement batches to OpenBIS using a YMD filter."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "BAM MOUSE team"}
]
dependencies = [
  "attrs>=23.2.0",
  "pybis>=1.36.0",
  "logbook2mouse @ git+https://github.com/BAMresearch/logbook2mouse.git",
  "jupyter-analysis-tools",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "flake8>=7.0.0",
  "pre-commit>=3.0.0",
  "pytest>=7.0.0",
]

[project.urls]
Repository = "https://example.invalid/replace-me"

[project.scripts]
openbis-mouse-uploader = "mouse_openbis_uploader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.flake8]
max-line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 120
group_by_package = true
known_first_party = "mouse_openbis_uploader"
ensure_newline_before_comments = true
extend_skip = ["ci/templates", ".ipynb_checkpoints"]
